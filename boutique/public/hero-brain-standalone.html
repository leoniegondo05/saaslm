<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Brain — prototype assemblage/explosion</title>
<style>
  :root {
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #070B1A;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* Vignette studio : fond pas plat, léger halo au centre + assombri aux bords */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 60% 45% at 50% 42%, rgba(120, 70, 200, .18), transparent 70%),
      radial-gradient(ellipse 140% 100% at 50% 50%, #0b1230 0%, #070B1A 60%, #04060f 100%);
  }

  .stage {
    position: relative;
    width: min(78vmin, 640px);
    aspect-ratio: 965 / 926;
    container-type: size; /* rend cqw/cqh disponibles pour --tx/--ty */
    opacity: 0;
    transition: opacity .6s ease;
  }
  body.is-ready .stage { opacity: 1; }

  /* Reflet au sol : visible quand le cerveau est assemblé, s'estompe à l'explosion */
  .floor {
    position: absolute;
    left: 40.67%;
    top: 66%;
    width: 46%;
    height: 10%;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 45, 149, .45), rgba(255, 45, 149, .12) 55%, transparent 75%);
    filter: blur(6px);
    animation: floor-fade 6s cubic-bezier(.45, 0, .2, 1) infinite;
  }

  /* Hub rose : caché derrière le cerveau assemblé, apparaît + grossit à l'explosion */
  .hub {
    position: absolute;
    left: 16.34%;
    top: 21.56%;
    width: 53.06%;
    height: 58.3%;
    z-index: 0;
    filter: drop-shadow(0 0 18px rgba(255, 32, 150, .55));
    animation: hub-appear 6s cubic-bezier(.45, 0, .2, 1) infinite;
  }
  .hub img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .piece {
    position: absolute;
    translate: 0 0; /* écrasé par les keyframes piece-explode */
    animation: piece-explode 6s cubic-bezier(.45, 0, .2, 1) infinite;
  }
  .piece-rot {
    /* rotation fixe (tilt Figma) séparée du translate d'explosion, pour que les deux se cumulent */
    display: block;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%) rotate(-12.53deg);
  }
  .piece img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    /* rendu plastique gonflable : ombre portée + léger liseré clair */
    filter:
      drop-shadow(0 14px 20px rgba(0, 0, 0, .55))
      drop-shadow(0 2px 3px rgba(255, 255, 255, .18))
      saturate(1.08) contrast(1.03);
  }

  .piece--violet      { left: 43.8%; top: 35.2%; width: 34%; height: 23%; z-index: 5; --tx: 16.3cqw; --ty: -12.5cqh; --bob: -9px; }
  .piece--bleu-fonce  { left: 38.3%; top: 40.7%; width: 27%; height: 32%; z-index: 3; --tx: -23.8cqw; --ty: -12.6cqh; --bob: 7px; }
  .piece--blanc       { left: 45.7%; top: 41.6%; width: 30%; height: 19%; z-index: 4; --tx: 31.0cqw; --ty: 9.2cqh; --bob: -6px; }
  .piece--noir        { left: 38.3%; top: 46.7%; width: 24%; height: 23%; z-index: 2; --tx: -7.2cqw; --ty: 19.2cqh; --bob: 8px; }
  .piece--bleu-strie  { left: 44.9%; top: 49.6%; width: 27%; height: 27%; z-index: 1; --tx: 16.2cqw; --ty: 29.2cqh; --bob: -8px; }

  @keyframes piece-explode {
    0%, 8%    { translate: 0px 0px; }
    40%       { translate: var(--tx) var(--ty); }
    50%       { translate: var(--tx) calc(var(--ty) + var(--bob)); }
    60%       { translate: var(--tx) var(--ty); }
    92%, 100% { translate: 0px 0px; }
  }

  @keyframes hub-appear {
    0%, 8%    { opacity: 0; scale: .55; }
    40%, 60%  { opacity: 1; scale: 1.08; }
    92%, 100% { opacity: 0; scale: .55; }
  }

  @keyframes floor-fade {
    0%, 8%    { opacity: .55; scale: 1; }
    40%, 60%  { opacity: .12; scale: 1.22; }
    92%, 100% { opacity: .55; scale: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .piece, .hub, .floor { animation: none !important; }
    .piece { translate: 0 0; }
    .hub { opacity: 0; scale: .55; }
  }

  body.is-paused .piece,
  body.is-paused .hub,
  body.is-paused .floor { animation-play-state: paused; }
</style>
</head>
<body>
  <div class="scene">
    <div class="stage" role="img"
         aria-label="Cerveau composé de 5 pièces glossy autour d'un hub rose : assemblage, explosion, réassemblage en boucle">
      <div class="floor"></div>
      <div class="hub"><img src="images/hero-brain/hero-brain-connector.png" alt=""></div>

      <div class="piece piece--violet">
        <div class="piece-rot"><img src="images/hero-brain/piece-top.png" alt="Morceau violet, haut-droite"></div>
      </div>
      <div class="piece piece--bleu-fonce">
        <div class="piece-rot"><img src="images/hero-brain/piece-left.png" alt="Morceau bleu foncé, haut-gauche"></div>
      </div>
      <div class="piece piece--blanc">
        <div class="piece-rot"><img src="images/hero-brain/piece-right.png" alt="Morceau blanc lavande"></div>
      </div>
      <div class="piece piece--noir">
        <div class="piece-rot"><img src="images/hero-brain/piece-bottom-left.png" alt="Morceau noir, bas-gauche"></div>
      </div>
      <div class="piece piece--bleu-strie">
        <div class="piece-rot"><img src="images/hero-brain/piece-bottom-right.png" alt="Morceau bleu strié, bas-droite"></div>
      </div>
    </div>
  </div>

<script>
  // Précharge les 6 PNG, révèle la scène une fois prêtes (évite le flash d'images cassées/non stylées).
  var srcs = [
    "images/hero-brain/hero-brain-connector.png",
    "images/hero-brain/piece-top.png",
    "images/hero-brain/piece-left.png",
    "images/hero-brain/piece-right.png",
    "images/hero-brain/piece-bottom-left.png",
    "images/hero-brain/piece-bottom-right.png"
  ];
  var loaded = 0;
  srcs.forEach(function (src) {
    var img = new Image();
    img.onload = img.onerror = function () {
      loaded++;
      if (loaded === srcs.length) document.body.classList.add("is-ready");
    };
    img.src = src;
  });

  // Coupe l'animation (CPU/GPU) quand l'onglet n'est pas visible.
  document.addEventListener("visibilitychange", function () {
    document.body.classList.toggle("is-paused", document.hidden);
  });
</script>
</body>
</html>
